name: Update dependency bundles

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'

workflow_dispatch:

permissions:
  contents: write

jobs:
  update-bundles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Update jsPDF bundle
        run: |
          cp node_modules/jspdf/dist/jspdf.umd.min.js ./jspdf.umd.min.js

      - name: Check Fuse.js package
        run: |
          echo "Installed Fuse.js version:"
          npm list fuse.js
          echo ""
          echo "Contents of node_modules/fuse.js:"
          find node_modules/fuse.js -maxdepth 2 -type f | sort

      - name: Update html2canvas bundle
        run: |
          cp node_modules/html2canvas/dist/html2canvas.min.js ./html2canvas.min.js

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- jspdf.umd.min.js fuse.min.js html2canvas.min.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated bundles
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add jspdf.umd.min.js fuse.min.js html2canvas.min.js
          git commit -m "Update dependency bundles"
          git push
